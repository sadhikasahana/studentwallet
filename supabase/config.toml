project_id = "qtzixqtthdpelrgfglfd"

[auth]
enabled = true
site_url = "http://127.0.0.1:54321"
additional_redirect_urls = ["https://lovable.dev"]
jwt_expiry = 3600

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1s"

[auth.sms]
enable_signup = true
enable_confirmations = true
max_frequency = "1s"
template = "Your code is {{ .Code }} ."

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.external.apple]
enabled = false

[auth.external.azure]
enabled = false

[auth.external.facebook]
enabled = false

[auth.external.github]
enabled = false

[auth.external.gitlab]
enabled = false

[auth.external.google]
enabled = false

[functions.send-email-alert]
verify_jwt = false

[functions.voice-to-expense]
verify_jwt = false
